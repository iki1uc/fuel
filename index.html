<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL NATURA · ROTATIONAL ENGINE · RUN21</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#eef2f5;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#1c2230;
    padding:24px;
    display:flex;
    justify-content:center;
  }
  .wrap { max-width:960px; width:100%; }
  header { margin-bottom:20px; }
  header h1 { font-size:22px; font-weight:600; }
  header p { color:#5a6478; font-size:13px; margin-top:4px; }

  .grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }

  .card {
    background:#fff;
    border:1px solid #d9dde3;
    border-radius:10px;
    padding:18px;
    margin-bottom:20px;
  }
  .card h2 { font-size:14px; font-weight:600; margin-bottom:10px; }

  .row {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #f0f1f4;
    font-size:13px;
  }
  .row:last-child{ border-bottom:none; }
  .row .label{ color:#5a6478; }
  .row .value{ font-weight:600; font-variant-numeric:tabular-nums; }

  canvas {
    width:100%;
    max-width:400px;
    display:block;
    margin:12px auto;
    background:#fafbfc;
    border:1px solid #e2e5eb;
    border-radius:8px;
  }

  .btnrow { margin-top:10px; }
  button {
    background:#1c2230;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    margin:2px 6px 0 0;
  }
  button:hover{ background:#333c4f; }
  button.secondary { background:#fff; color:#1c2230; border:1px solid #d5d9e0; }
  button.secondary:hover{ background:#f0f1f4; }

  .log {
    height:160px;
    overflow-y:auto;
    background:#f9fafb;
    border:1px solid #e2e5eb;
    border-radius:8px;
    padding:10px 12px;
    font-family:ui-monospace,"SF Mono",monospace;
    font-size:12px;
    line-height:1.6;
    color:#5a6478;
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>ALL NATURA · ROTATIONAL ENGINE</h1>
  <p>RUN21 · Achsen‑Rotation · Potenz‑Skalierung · Orbit‑Pfad</p>
</header>

<div class="grid">

  <div>
    <div class="card">
      <h2>Rotational‑Status</h2>

      <div class="row"><span class="label">A81</span><span class="value" id="a81Display">81</span></div>
      <div class="row"><span class="label">Zahnrad</span><span class="value" id="zahnradDisplay">0</span></div>
      <div class="row"><span class="label">Step</span><span class="value" id="stepDisplay">0</span></div>

      <div class="row"><span class="label">Achse (RUN21)</span><span class="value" id="axisDisplay">-</span></div>
      <div class="row"><span class="label">Potenz (RUN21)</span><span class="value" id="potenzDisplay">-</span></div>

      <div class="row"><span class="label">nano</span><span class="value" id="nanoDisplay">-</span></div>
      <div class="row"><span class="label">rein</span><span class="value" id="reinDisplay">-</span></div>
      <div class="row"><span class="label">impuls</span><span class="value" id="impulsDisplay">-</span></div>
      <div class="row"><span class="label">Δt</span><span class="value" id="deltaDisplay">0</span></div>

    </div>
  </div>

  <div>
    <div class="card">
      <h2>Orbit‑Rotation</h2>
      <canvas id="orbitCanvas" width="400" height="400"></canvas>

      <div class="btnrow">
        <button id="stepBtn">Step</button>
        <button id="loopBtn" class="secondary">▶ Loop</button>
        <button id="stopBtn" class="secondary">⏹ Stop</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>
  </div>

</div>

<div class="card">
  <h2>Log</h2>
  <div class="log" id="logBox">Rotational Engine geladen.</div>
</div>

</div>

<script>
/* ============================================================
   STATE
============================================================ */
const state = {
  a81: 81,
  zahnrad: 0,
  step: 0,
  axis: "-",
  potenz: "-",
  nano: "-",
  rein: "-",
  impuls: "-",
  delta: 0
};

let lastTime = performance.now();

/* ============================================================
   ENGINE
============================================================ */
class RotationalEngine {

  constructor() {
    this.pfad = [3,9,81,243,81,9];
    this.pfadIndex = 0;
  }

  innen() {
    this.pfadIndex = (this.pfadIndex + 1) % this.pfad.length;
    state.a81 = this.pfad[this.pfadIndex];
  }

  tick() {
    state.zahnrad = (state.zahnrad + 1) % 12;
  }

  run() {
    this.innen();
    this.tick();

    const POTENZEN = [1,3,9,27,81,243,729];
    state.potenz = POTENZEN[state.step % POTENZEN.length];

    const AXIS = ["d","e","i","n","o","r","s","u","w"];
    state.axis = AXIS[state.step % AXIS.length];

    state.nano = (state.a81 / 9).toFixed(2);
    state.rein = Math.sqrt(state.a81).toFixed(2);
    state.impuls = state.step % 2 === 0 ? "KUCK" : "KUCK-KUCK";

    const now = performance.now();
    state.delta = (now - lastTime).toFixed(0);
    lastTime = now;

    state.step++;
  }
}

const engine = new RotationalEngine();

/* ============================================================
   ORBIT RENDER
============================================================ */
function drawOrbit() {
  const c = document.getElementById("orbitCanvas");
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);

  const cx = c.width/2;
  const cy = c.height/2;
  const r = 150;

  const AXIS = ["d","e","i","n","o","r","s","u","w"];

  AXIS.forEach((a,i)=>{
    const angle = (i / AXIS.length) * 2 * Math.PI - Math.PI/2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    const active = (a === state.axis);

    ctx.beginPath();
    ctx.arc(x,y, active ? 26 : 18, 0, 2*Math.PI);
    ctx.fillStyle = active ? "#1c2230" : "#fff";
    ctx.fill();
    ctx.strokeStyle = active ? "#1c2230" : "#c5cad3";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = active ? "#fff" : "#1c2230";
    ctx.font = "600 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(a, x, y);
  });
}

/* ============================================================
   DISPLAY
============================================================ */
function updateDisplay() {
  document.getElementById("a81Display").textContent = state.a81;
  document.getElementById("zahnradDisplay").textContent = state.zahnrad;
  document.getElementById("stepDisplay").textContent = state.step;

  document.getElementById("axisDisplay").textContent = state.axis;
  document.getElementById("potenzDisplay").textContent = state.potenz;

  document.getElementById("nanoDisplay").textContent = state.nano;
  document.getElementById("reinDisplay").textContent = state.rein;
  document.getElementById("impulsDisplay").textContent = state.impuls;
  document.getElementById("deltaDisplay").textContent = state.delta;

  drawOrbit();
}

function log(msg) {
  const t = new Date().toLocaleTimeString("de-DE");
  const box = document.getElementById("logBox");
  box.innerHTML = `[${t}] ${msg}<br>` + box.innerHTML;
}

/* ============================================================
   LOOP
============================================================ */
let loop = null;

function step() {
  engine.run();
  updateDisplay();
  log(`Step ${state.step}: A81=${state.a81}, Axis=${state.axis}, Potenz=${state.potenz}`);
}

document.getElementById("stepBtn").onclick = step;

document.getElementById("loopBtn").onclick = ()=>{
  if(loop) return;
  loop = setInterval(step, 500);
};

document.getElementById("stopBtn").onclick = ()=>{
  clearInterval(loop);
  loop = null;
};

document.getElementById("resetBtn").onclick = ()=>{
  clearInterval(loop);
  loop = null;
  state.a81 = 81;
  state.zahnrad = 0;
  state.step = 0;
  state.axis = "-";
  state.potenz = "-";
  state.nano = "-";
  state.rein = "-";
  state.impuls = "-";
  state.delta = 0;
  updateDisplay();
  log("Reset → zurück zu 81.");
};

updateDisplay();
log("Rotational Engine gestartet.");
</script>
</body>
</html>
