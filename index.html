<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>🪐 SATURN · 3 Ringe · balanciert</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
  }
  canvas {
    background:#0a0a12;
    border-radius:50%;
    box-shadow: 0 0 60px rgba(100,200,255,0.15);
  }
</style>
</head>
<body>

<canvas id="saturn" width="500" height="500"></canvas>

<script>
  const canvas = document.getElementById('saturn');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2;

  // Ring‑Konfiguration
  const rings = [
    { radius: 80, color: '#ff4466', speed: -0.025, label: 'negativ' },
    { radius: 130, color: '#44ccff', speed:  0.018, label: 'positiv' },
    { radius: 180, color: '#66ff99', speed:  0.005, label: 'neutral' }
  ];

  // Startwinkel für jeden Ring
  let angles = rings.map(() => Math.random() * 2 * Math.PI);

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ─── Hintergrund‑Glow ────────────────────────────────────
    const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, 220);
    grad.addColorStop(0, 'rgba(180,220,255,0.04)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ─── Ringe zeichnen ──────────────────────────────────────
    rings.forEach((ring, i) => {
      const r = ring.radius;
      const angle = angles[i];

      // Ring‑Linie (leicht leuchtend)
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.strokeStyle = ring.color;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      // Rotierender Punkt auf dem Ring (Satellit)
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      // Punkt‑Glow
      const glow = ctx.createRadialGradient(x, y, 2, x, y, 18);
      glow.addColorStop(0, ring.color);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, 2 * Math.PI);
      ctx.fill();

      // Punkt‑Kern
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = ring.color;
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Kleine Beschriftung (entfernt, aber wir lassen die Ring‑Farben wirken)
    });

    // ─── Zentraler Planet ──────────────────────────────────────
    const planetGrad = ctx.createRadialGradient(cx-10, cy-10, 5, cx, cy, 35);
    planetGrad.addColorStop(0, '#fffbe6');
    planetGrad.addColorStop(0.7, '#f7d44a');
    planetGrad.addColorStop(1, '#b88a2a');
    ctx.shadowColor = '#ffdd77';
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
    ctx.fillStyle = planetGrad;
    ctx.fill();
    ctx.shadowBlur = 0;

    // kleines Leuchten um den Planeten
    const halo = ctx.createRadialGradient(cx, cy, 30, cx, cy, 55);
    halo.addColorStop(0, 'rgba(255,220,100,0.15)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, 55, 0, 2 * Math.PI);
    ctx.fill();

    // ─── Winkel aktualisieren (unterschiedliche Richtungen) ──
    rings.forEach((ring, i) => {
      angles[i] += ring.speed;
    });

    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
