<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OVERDRIVE · Kreisel</title>
<style>
  body {
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  canvas {
    background:#000;
    border:2px solid #444;
    border-radius:10px;
  }
</style>
</head>
<body>

<canvas id="kreisel" width="400" height="400"></canvas>

<script>
const c = document.getElementById("kreisel");
const ctx = c.getContext("2d");

let angle = 0;

function draw() {
  ctx.clearRect(0,0,c.width,c.height);

  const cx = c.width/2;
  const cy = c.height/2;
  const r  = 120;

  // Kreis
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.strokeStyle = "#0f0";
  ctx.lineWidth = 4;
  ctx.stroke();

  // Rotierender Punkt
  const x = cx + r * Math.cos(angle);
  const y = cy + r * Math.sin(angle);

  ctx.beginPath();
  ctx.arc(x, y, 12, 0, 2*Math.PI);
  ctx.fillStyle = "#f00";
  ctx.fill();

  angle += 0.05;
}

setInterval(draw, 30);
</script>

</body>
</html>
