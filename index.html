<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AMIGA · MCFLY · Warp‑Gate</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:sans-serif;
  }
  canvas {
    background:#000;
  }
</style>
</head>
<body>

<canvas id="scene" width="700" height="400"></canvas>

<script>
const c = document.getElementById("scene");
const ctx = c.getContext("2d");

let cube = {
  x: 120,
  y: c.height/2,
  size: 22,
  scale: 1,
  speed: 2.2,
  entering: false,
  alpha: 1,
  warp: 0
};

const gate = {
  x: 520,
  y: c.height/2,
  r: 70,
  wave: 0,
  shimmer: 0
};

function drawGate() {
  gate.wave += 0.05;
  gate.shimmer = Math.sin(gate.wave * 0.7) * 0.2 + 0.3;

  // Flüssige Membran
  const grd = ctx.createRadialGradient(
    gate.x, gate.y, gate.r * 0.1,
    gate.x, gate.y, gate.r * 1.4
  );
  grd.addColorStop(0, `rgba(120,180,255,${gate.shimmer})`);
  grd.addColorStop(0.4, `rgba(120,180,255,${gate.shimmer * 0.4})`);
  grd.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(gate.x, gate.y, gate.r + Math.sin(gate.wave)*4, 0, Math.PI*2);
  ctx.fill();

  // Schimmernder Rand
  ctx.strokeStyle = `rgba(180,220,255,${gate.shimmer})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(gate.x, gate.y, gate.r + Math.sin(gate.wave)*3, 0, Math.PI*2);
  ctx.stroke();
}

function drawCube() {
  ctx.save();
  ctx.globalAlpha = cube.alpha;

  const s = cube.size * cube.scale;

  // Warp‑Verzerrung
  const warpOffset = Math.sin(cube.warp) * (cube.scale * 2);

  ctx.fillStyle = "#44ccff";
  ctx.fillRect(
    cube.x - s/2 - warpOffset,
    cube.y - s/2,
    s + warpOffset*2,
    s
  );

  ctx.restore();
}

function update() {
  ctx.clearRect(0,0,c.width,c.height);

  drawGate();
  drawCube();

  if (!cube.entering) {
    cube.x += cube.speed;

    if (cube.x >= gate.x - gate.r) {
      cube.entering = true;
    }
  } else {
    cube.warp += 0.2;

    // 4× Vergrößerung
    if (cube.scale < 4) cube.scale += 0.12;

    // Warp‑Fade
    cube.alpha -= 0.025;

    // Einsaugen
    cube.x += 1.5;
    cube.y += Math.sin(cube.x * 0.08) * 0.7;
  }

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
